spring.application.name=mygame-server

server.port=${MYGAME_SERVER_PORT:8080}

spring.datasource.url=${MYGAME_DB_URL:jdbc:postgresql://localhost:5432/mygame}
spring.datasource.username=${MYGAME_DB_USER:mygame}
spring.datasource.password=${MYGAME_DB_PASSWORD:local-dev-password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

mygame.sfs.zone=${MYGAME_SFS_ZONE:marhab}
mygame.sfs.websocket-path=${MYGAME_SFS_WEBSOCKET_PATH:/BlueBox/websocket}
mygame.sfs.dev-auth-token=${MYGAME_DEV_AUTH_TOKEN:dev-token}
mygame.cdn.file-server=${MYGAME_FILE_SERVER:http://127.0.0.1:8090}
mygame.world.first-room=${MYGAME_FIRST_ROOM:airport}
mygame.web.host=${MYGAME_WEB_HOST:127.0.0.1:8080}
mygame.assets.cdn-dir=${MYGAME_ASSETS_CDN_DIR:../assets/cdn}
mygame.seed.privileged-emails=${MYGAME_SEED_PRIVILEGED_EMAILS:}

# CDN mirror: local-first, pull-through to upstream on miss.
# public-host is the bare host (no scheme) sent to the client as fileServer.
# Default = local pull-through; the client uses protocol=http://, and the remote
# CDN does not serve over HTTP port 80 -> serving locally is required for any
# asset (hand-item SWFs, room SWFs, locale, etc.) to actually arrive.
mygame.cdn.upstream=${MYGAME_CDN_UPSTREAM:https://xo.newmarhab.net}
mygame.cdn.public-host=${MYGAME_CDN_PUBLIC_HOST:127.0.0.1:8080}
mygame.cdn.pull-through-enabled=${MYGAME_CDN_PULL_THROUGH:true}
mygame.cdn.negative-ttl-seconds=${MYGAME_CDN_NEGATIVE_TTL:600}
mygame.cdn.upstream-connect-timeout-ms=${MYGAME_CDN_CONNECT_TIMEOUT_MS:5000}
mygame.cdn.upstream-request-timeout-ms=${MYGAME_CDN_REQUEST_TIMEOUT_MS:60000}
mygame.cdn.warmup-on-startup=${MYGAME_CDN_WARMUP_ON_STARTUP:false}
mygame.cdn.warmup-concurrency=${MYGAME_CDN_WARMUP_CONCURRENCY:4}
mygame.cdn.warmup-max-items=${MYGAME_CDN_WARMUP_MAX_ITEMS:2147483647}
mygame.cdn.warmup-item-file=${MYGAME_CDN_WARMUP_ITEM_FILE:global/static/data/ifile.2013}
mygame.assets.report-dir=${MYGAME_ASSETS_REPORT_DIR:../assets/reports}
