services:
  postgres:
    image: postgres:16-alpine
    container_name: mygame-postgres
    environment:
      POSTGRES_DB: mygame
      POSTGRES_USER: mygame
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "5432:5432"
    volumes:
      - mygame-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygame -d mygame"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mygame-postgres-data:
